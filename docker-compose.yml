name: horus-pdv

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: horus-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: horus-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__HorusPdv: "Server=db,1433;Database=HorusPdv;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True"
      Auth__JwtSecret: ${AUTH_JWT_SECRET}
      Security__EncryptionKey: ${SECURITY_ENCRYPTION_KEY}
      Security__CorsOrigins: ${CORS_ORIGINS:-http://localhost:8080}
      Security__TrustForwardedHeaders: "true"
      Recaptcha__Enabled: ${RECAPTCHA_ENABLED:-false}
      Recaptcha__SecretKey: ${RECAPTCHA_SECRET_KEY:-}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__User: ${EMAIL_USER:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromEmail: ${EMAIL_FROM:-}
      Email__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:8080}
    ports:
      - "${API_PORT:-5260}:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
    container_name: horus-web
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  db_data:
